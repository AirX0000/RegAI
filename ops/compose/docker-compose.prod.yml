version: '3.8'

services:
  # 1. Nginx Reverse Proxy & Frontend Web Server (Exposed on 80/443)
  frontend:
    build:
      context: ../../
      dockerfile: ops/docker/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - regai_public
      - regai_internal

  # 2. FastAPI Backend Core Engine (Internal Network Only)
  backend:
    build:
      context: ../../
      dockerfile: ops/docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_strong_password}@postgres:5432/${POSTGRES_DB:-regai}
      - SECRET_KEY=${SECRET_KEY:-change_this_to_a_secure_random_hex_key_32_bytes}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - CHROMA_DIR=/app/chroma_db
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-["*"]}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-120}
      - LOG_JSON=true
    volumes:
      - backend_data:/app/data
      - chroma_data:/app/chroma_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - regai_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 3. PostgreSQL 15 Database (Internal Network Only - Isolated from Public Internet)
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_strong_password}
      - POSTGRES_DB=${POSTGRES_DB:-regai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - regai_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-regai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 4. ChromaDB Vector Database for RAG / Semantic Search
  chroma:
    image: chromadb/chroma:0.5.23
    restart: unless-stopped
    volumes:
      - chroma_standalone_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - regai_internal

networks:
  regai_public:
    driver: bridge
  regai_internal:
    driver: bridge
    internal: false

volumes:
  postgres_data:
  chroma_data:
  chroma_standalone_data:
  backend_data:
