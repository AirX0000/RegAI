name: CD

on:
  push:
    tags: [ 'v*' ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # needed for cosign
      
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Cosign
      uses: sigstore/cosign-installer@v3.4.0
      
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Build and push Backend
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ops/docker/backend.Dockerfile
        push: true
        tags: user/regai-backend:${{ github.ref_name }}
        
    - name: Sign Backend Image
      run: |
        cosign sign --yes --key env://COSIGN_PRIVATE_KEY user/regai-backend:${{ github.ref_name }}
      env:
        COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Helm
      uses: azure/setup-helm@v4
      
    - name: Deploy to K8s
      run: |
        helm upgrade --install regai ops/helm/regai \
          --set image.tag=${{ github.ref_name }} \
          --namespace regai-prod \
          --create-namespace
      env:
        KUBECONFIG: ${{ secrets.KUBECONFIG }}
